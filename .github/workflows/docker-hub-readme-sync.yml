name: Docker Hub Readme Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/README.md'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  sync-readme:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zaaicom/powernight
          short-description: "Tesla Powerwall backup reserve automation for Docker"
          readme-filepath: ./docs/README.md

      - name: Generate sync summary
        run: |
          {
            echo "## README Sync Complete"
            echo ""
            echo "README.md has been synced to Docker Hub."
            echo "[View on Docker Hub](https://hub.docker.com/r/zaaicom/powernight)"
          } >> "$GITHUB_STEP_SUMMARY"
