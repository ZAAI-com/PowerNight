name: Docker Security Scan

on:
  # Auto-run disabled - use manual trigger or enable as needed
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'Dockerfile'
  #     - 'requirements.txt'
  #     - 'pyproject.toml'
  #     - 'package.json'
  #     - 'package-lock.json'
  # schedule:
  #   # Run every Monday at 9:00 AM UTC to catch newly discovered vulnerabilities
  #   - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger only
    inputs:
      image_tag:
        description: 'Docker image tag to scan (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  DOCKER_IMAGE: zaaicom/powernight

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read           # Required by upload-sarif action
      contents: read
      security-events: write  # For uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine image tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${REQUESTED_TAG:-latest}"
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Scanning image: $DOCKER_IMAGE:$TAG"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true  # Don't fail workflow, but report issues

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for detailed output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Generate scan summary
        if: always()
        env:
          SCANNED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PYTHON'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          image = os.environ['DOCKER_IMAGE'] + ':' + os.environ['SCANNED_TAG']
          available = Path('trivy-results.sarif').exists()
          summary = f"## Security Scan Results\n\n**Image:** `{image}`\n\n"
          summary += f"**Scan date:** {datetime.now(timezone.utc).isoformat()}\n\n"
          summary += 'SARIF report produced.\n' if available else 'Scanner did not produce a SARIF report.\n'
          summary += f"\n### Manual scan\n\n```bash\ndocker pull {image}\ntrivy image {image}\n```\n"
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(summary)
          PYTHON
