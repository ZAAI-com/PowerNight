name: Docker Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to promote (for example 2.0.0)'
        required: true
        type: string
      digest:
        description: 'Exact sha256 digest from the successful Docker Publish run'
        required: true
        type: string
      canary_verified:
        description: 'Canary passed upgrade, restart, reconnect and an overnight scheduling cycle'
        required: true
        default: false
        type: boolean

concurrency:
  group: powernight-release-publication
  cancel-in-progress: false

jobs:
  promote:
    name: Promote tested digest to latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_DIGEST: ${{ inputs.digest }}
      CANARY_VERIFIED: ${{ inputs.canary_verified }}
      GHCR_IMAGE: ghcr.io/zaai-com/powernight
      DOCKERHUB_IMAGE: zaaicom/powernight
    steps:
      - name: Validate promotion request
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CANARY_VERIFIED" = true
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify both versioned images before changing either latest tag
        run: |
          for IMAGE in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            ACTUAL=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
            test "$ACTUAL" = "$EXPECTED_DIGEST"
            docker buildx imagetools inspect "$IMAGE@$EXPECTED_DIGEST" --raw > manifest.json
            python - <<'PY'
          import json
          with open('manifest.json') as stream:
              manifest = json.load(stream)
          platforms = {
              (item['platform']['os'], item['platform']['architecture'], item['platform'].get('variant', ''))
              for item in manifest['manifests']
          }
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= {(os, arch) for os, arch, _ in platforms}
          assert ('linux', 'arm', 'v7') in platforms
          PY
          done

      - name: Promote the verified digest without rebuilding
        run: |
          for IMAGE in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$EXPECTED_DIGEST"
            ACTUAL=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
            test "$ACTUAL" = "$EXPECTED_DIGEST"
            echo "Promoted $IMAGE:latest to $EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          done
