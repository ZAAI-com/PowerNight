name: Docker Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Trigger on version tags like 1.0.0, 1.2.0, etc.
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version (like 2.1.3)'
        required: true
        type: string

env:
  GHCR_IMAGE: ghcr.io/zaai-com/powernight
  DOCKERHUB_IMAGE: zaaicom/powernight
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

concurrency:
  group: powernight-release-publication
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish Multi-Arch Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # For GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for version info

      - name: Extract version from tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          if [ "$GITHUB_REF" != "refs/tags/$VERSION" ]; then
            echo "::error::Select refs/tags/$VERSION when dispatching this release workflow (not a branch)."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          echo "Installing PowerNight package..."
          pip install -e ".[build]"
          echo "✓ Backend package installed"

      - name: Verify release version matches source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/check_release_version.py "$RELEASE_VERSION"

      - name: Install frontend dependencies
        run: |
          # Retry npm ci up to 3 times to handle transient network errors
          for i in 1 2 3; do
            if npm ci; then
              break
            else
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying ($i/3)..."
              sleep 5
            fi
          done

      - name: Build frontend
        run: |
          chmod +x build.sh
          ./build.sh --no-docker

      - name: Verify build output
        run: |
          echo "Checking dist/ directory..."
          ls -lah dist/
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "✓ Frontend build successful"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=PowerNight
            org.opencontainers.image.description=Schedule Tesla Powerwall Grid-Charging during the night
            org.opencontainers.image.vendor=ZAAI
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Schedule Tesla Powerwall Grid-Charging during the night"
          readme-filepath: ./docs/README.md

      - name: Generate build summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          summary = f"""## Staged PowerNight {os.environ['VERSION']}

          Versioned images:
          - `{os.environ['GHCR_IMAGE']}:{os.environ['VERSION']}`
          - `{os.environ['DOCKERHUB_IMAGE']}:{os.environ['VERSION']}`

          Digest: `{os.environ['DIGEST']}`
          Platforms: `{os.environ['PLATFORMS']}`

          **latest is unchanged.** Complete canary validation, then run Docker Promote
          from main with this version, digest, and `canary_verified=true`. Do not rebuild for promotion.
          """
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(summary)
          PYTHON
