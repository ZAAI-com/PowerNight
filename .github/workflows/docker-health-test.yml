name: Docker Health Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'build.sh'
      - 'package*.json'
      - 'config/**'
      - 'docker-compose.yml'
      - 'compose.release-test.yml'
      - 'scripts/release_smoke.py'
      - 'src/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/docker-*.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'build.sh'
      - 'package*.json'
      - 'config/**'
      - 'docker-compose.yml'
      - 'compose.release-test.yml'
      - 'scripts/release_smoke.py'
      - 'src/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/docker-*.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_IMAGE: powernight-test

jobs:
  health-test:
    name: Build and Health Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          echo "Installing PowerNight package..."
          pip install -e .
          echo "✓ Backend package installed"

      - name: Install frontend dependencies
        run: |
          # Retry npm ci up to 3 times to handle transient network errors
          for i in 1 2 3; do
            if npm ci; then
              break
            else
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying ($i/3)..."
              sleep 5
            fi
          done

      - name: Build frontend
        run: |
          chmod +x build.sh
          ./build.sh --no-docker

      - name: Verify build output
        run: |
          echo "Checking dist/ directory..."
          ls -lah dist/
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "✓ Frontend build successful"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image (amd64 only for speed)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify migrations, API auth and persistence with Docker Compose
        run: python scripts/release_smoke.py --image "$DOCKER_IMAGE:test"

      - name: Show smoke test logs
        if: always()
        run: |
          shopt -s nullglob
          for LOG in .context/release/compose-smoke/*.log; do
            cat "$LOG"
          done

      - name: Generate test summary
        if: success()
        run: cat .context/release/compose-smoke/report.json >> "$GITHUB_STEP_SUMMARY"
