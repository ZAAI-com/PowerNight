[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powernight"
version = "1.0.0"
description = "Docker container to control Tesla Powerwall 2 backup reserve percentage during nighttime hours"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "PowerNight Team", email = "powernight@zaai.com"}
]
maintainers = [
    {name = "PowerNight Team", email = "powernight@zaai.com"}
]
keywords = ["tesla", "powerwall", "automation", "docker", "synology", "energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Utilities"
]
requires-python = ">=3.10"
dependencies = [
    "pypowerwall>=0.11.0",
    "Flask>=2.3.0",
    "Flask-CORS>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "schedule>=1.2.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "structlog>=23.1.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.23.0",
    "psutil>=7.1.0",
    "cryptography>=44.0.0",
    "bcrypt>=4.2.1",
    "passlib>=1.7.4",
    "pyjwt>=2.10.1",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.0",
    "apscheduler>=3.10.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
    "pre-commit>=3.3.0",
    "isort>=5.12.0",
    "bandit>=1.7.5"
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0"
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "testcontainers>=3.7.0"
]

[project.scripts]
powernight = "powernight.main:main"
powernight-cli = "powernight.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/ZAAI-com/PowerNight"
Documentation = "https://github.com/ZAAI-com/PowerNight/blob/main/README.md"
Repository = "https://github.com/ZAAI-com/PowerNight"
"Bug Tracker" = "https://github.com/ZAAI-com/PowerNight/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["powernight*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.html", "*.css", "*.js"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["powernight"]

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pypowerwall.*", "schedule.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

# Coverage configuration
[tool.coverage.run]
source = ["src/powernight"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101", "B601"]