[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powernight"
version = "2.0.0"
description = "Docker container to control Tesla Powerwall 2 backup reserve percentage during nighttime hours"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "PowerNight Team", email = "powernight@zaai.com"}
]
maintainers = [
    {name = "PowerNight Team", email = "powernight@zaai.com"}
]
keywords = ["tesla", "powerwall", "automation", "docker", "synology", "energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "pypowerwall>=0.18.2",
    "Flask>=3.1.3",
    "Flask-CORS>=6.0.5",
    "SQLAlchemy>=2.1.3",
    "schedule>=1.2.2",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "click>=8.5.0",
    "pytz>=2026.4",
    "jsonschema>=4.26.0",
    "psutil>=7.2.2",
    "cryptography>=50.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "black>=26.5.1",
    "flake8>=7.4.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
    "pre-commit>=4.6.2",
    "isort>=9.0.2",
    "bandit>=1.9.4"
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0"
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "testcontainers>=4.15.0"
]

[project.scripts]
powernight = "powernight.main:main"
powernight-cli = "powernight.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/ZAAI-com/PowerNight"
Documentation = "https://github.com/ZAAI-com/PowerNight/blob/main/README.md"
Repository = "https://github.com/ZAAI-com/PowerNight"
"Bug Tracker" = "https://github.com/ZAAI-com/PowerNight/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["powernight*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.html", "*.css", "*.js"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["powernight"]

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pypowerwall.*", "schedule.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

# Coverage configuration
[tool.coverage.run]
source = ["src/powernight"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101", "B601"]